services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vector
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - vector_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector -d vector"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: vector
      PGUSER: vector
      PGPASSWORD: ${POSTGRES_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      MAX_BODY_MB: ${MAX_BODY_MB:-25}
      TRUST_PROXY: "true"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [backend, frontend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]

volumes:
  vector_postgres:

networks:
  backend:
    internal: true
  frontend:
